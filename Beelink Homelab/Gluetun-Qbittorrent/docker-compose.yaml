services:
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun

    ports:
      - 8080:8080 # qBittorrent Web UI

    volumes:
      - ./gluetun:/gluetun

    environment:
      TZ: America/Chicago

      # ProtonVPN / WireGuard
      VPN_SERVICE_PROVIDER: protonvpn
      VPN_TYPE: wireguard
      WIREGUARD_PRIVATE_KEY: ${WIREGUARD_PRIVATE_KEY}
      SERVER_COUNTRIES: ${VPN_COUNTRY}

      # Select a port-forwarding-capable server and request a port
      PORT_FORWARD_ONLY: on
      VPN_PORT_FORWARDING: on

      # Apply the assigned VPN port to qBittorrent.
      VPN_PORT_FORWARDING_UP_COMMAND: >-
        /bin/sh -c 'wget -O- -nv --retry-connrefused
        --post-data "json={\"listen_port\":{{PORT}},\"current_network_interface\":\"{{VPN_INTERFACE}}\",\"random_port\":false,\"upnp\":false}"
        http://127.0.0.1:8080/api/v2/app/setPreferences'

      # Reset the listener when forwarding stops.
      VPN_PORT_FORWARDING_DOWN_COMMAND: >- 
        /bin/sh -c 'wget -O- -nv --retry-connrefused 
        --post-data "json={\"listen_port\":0,\"current_network_interface\":\"lo\"}" http://127.0.0.1:8080/api/v2/app/setPreferences'

    restart: unless-stopped

*********************************************************************************

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent

    network_mode: "service:gluetun"

    depends_on:
      gluetun:
        condition: service_healthy

    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: America/Chicago
      WEBUI_PORT: "8080"

    volumes:
      - /mnt/labfiles/docker-data/qbittorrent/config:/config
      - /mnt/labfiles/torrents:/torrents

    restart: unless-stopped
