############################
# SEERR
############################

  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    init: true
    environment:
      - LOG_LEVEL=info
      - TZ=America/Chicago
      - PORT=5055
    volumes:
      - /mnt/labfiles/docker-data/seerr/config:/app/config
    ports:
      - 5055:5055
    restart: unless-stopped
