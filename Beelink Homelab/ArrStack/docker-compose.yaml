---
services:

############################
# SONARR
############################

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
    volumes:
      - /mnt/labfiles/docker-data/sonar:/config
      - /mnt/labfiles/torrents:/torrents
    ports:
      - 8989:8989
    restart: unless-stopped     


############################
# RADARR
############################

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    ports:
      - 7878:7878
    environment:
      - PUID=${USER_ID}
      - PGID=${GROUP_ID}
      - TZ=America/Chicago
    volumes:
      - /mnt/labfiles/docker-data/radarr:/config
      - /mnt/labfiles/torrents:/torrents
    restart: unless-stopped


############################
# JELLYFIN
############################

  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    environment:
      - TZ=America/Chicago
    volumes:
      - /mnt/labfiles/docker-data/jellyfin/config:/config
      - /mnt/labfiles/docker-data/jellyfin/cache:/cache
      - /mnt/labfiles/torrents:/Movies
      - /mnt/labfiles/torrents:/TV_Shows
    ports:
      - 8096:8096
      - 8920:8920 #optional
      - 7359:7359/udp #optional
      - 1900:1900/udp #optional

    restart: unless-stopped

############################
# PROWLARR
############################

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    ports:
      - 9696:9696
    environment:
      - PUID=${USER_ID}
      - PGID=${GROUP_ID}
      - TZ=America/Chicago
    volumes:
      - /mnt/labfiles/docker-data/prowlarr:/config
    restart: unless-stopped

############################
# BAZARR
############################

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
    volumes:
      - /mnt/labfiles/docker-data/bazarr/config:/config
      - /mnt/labfiles/torrents:/torrents
    ports:
      - 6767:6767
    restart: unless-stopped

    
############################
# SEER
############################

  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    init: true
    environment:
      - LOG_LEVEL=info
      - TZ=America/Chicago
      - PORT=5055
    volumes:
      - /mnt/labfiles/docker-data/seerr/config:/app/config
    ports:
      - 5055:5055
    restart: unless-stopped
