
##########################################################################################################################

- Media Management:
  - Radarr:
      icon: radarr.png
      href: http://192.168.30.6:7878
      description: Movie Manager
      server: my-docker
      container: radarr
      widget:
        type: radarr
        url: http://192.168.30.6:7878
        key: {{HOMEPAGE_VAR_RADARR}}
        fields: ["wanted", "missing", "queued", "movies"]

  - Prowlarr:
      icon: prowlarr.png
      href: http://192.168.30.6:9696
      description: Indexer integration for downloads
      server: my-docker
      container: prowlarr
      widget:
          type: prowlarr
          url: http://192.168.30.6:9696
          key: {{HOMEPAGE_VAR_PROWLARR}}
          fields: ["numberOfGrabs", "numberOfQueries", "numberOfFailGrabs", "numberOfFailQueries"]

################################################################################       
- Utilities:
  - Speedtest:
        icon: speedtest-tracker.png
        href: http://192.168.30.6:8081
        description: Network speed tracker
        container: speedtest
        widget:
          type: speedtest-tracker
          url: http://192.168.30.6:8081
          bitratePrecision: 0
          fields: ["download", "upload", "ping"]

  - Adguard:
      icon: adguard-home.png
      href: http://192.168.30.6
      description: DNS Filter
      container: adguard
      widget:
        type: adguard
        url: http://192.168.30.6
        username: ${HOMEPAGE_VAR_USER}
        password: ${HOMEPAGE_VAR_PASS}
        fields: ["queries", "blocked", "latency"]


           
##########################################################################################################################

- Media Players:
  - Jellyfin:  
      icon: jellyfin.png
      hreff: http://192.168.30.6:8096
      server: my-docker
      container: jellyfin
      description: Media Player
      widget:
          type: jellyfin
          url: http://192.168.30.6:8096
          key: {{HOMEPAGE_VAR_JELLYFIN}}
          enableBlocks: true # optional, defaults to false
          enableNowPlaying: true # optional, defaults to true
          enableUser: true # optional, defaults to false
          enableMediaControl: false # optional, defaults to true
          showEpisodeNumber: true # optional, defaults to false
          expandOneStreamToTwoRows: false # optional, defaults to true        
          
