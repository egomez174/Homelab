
---
services:

############################
# QBITTORRENT
############################

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: service:gluetun
    environment:
      - PUID=${USER_ID}
      - PGID=${GROUP_ID}
      - TZ=America/Chicago
      - WEBUI_PORT=8080
    volumes:
      - /mnt/labfiles/docker-data/qbittorrent/config:/config
      - /mnt/labfiles/torrents:/torrents
    restart: unless-stopped

############################
# SONARR
############################

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
    volumes:
      - /mnt/labfiles/docker-data/sonar:/config
      - /mnt/labfiles/torrents:/torrents/tv_shows
    ports:
      - 8989:8989
    restart: unless-stopped    


############################
# RADARR
############################

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    ports:
      - 7878:7878
    environment:
      - PUID=${USER_ID}
      - PGID=${GROUP_ID}
      - TZ=America/Chicago
    volumes:
      - /mnt/labfiles/docker-data/radarr:/config
      - /mnt/labfiles/torrents:/torrents/movies
    restart: unless-stopped

############################
# GLUETUN
############################

  gluetun:
    image: qmcgaw/gluetun
    container_name: gluetun
    ports:
      - 6881:6881 #qbittorrent
      - 6881:6881/udp #qbittorrent
      - 8080:8080 #qbittorrent web port
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=ipvanish
      - OPENVPN_USER=${USERNAME}
      - OPENVPN_PASSWORD=${PASS}
      - SERVER_COUNTRIES=United States
    restart: always

############################
# JELLYFIN
############################

  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=${USER_ID}
      - PGID=${GROUP_ID}
      - TZ=America/Chicago
    volumes:
      - /mnt/labfiles/docker-data/jellyfin/config:/config
      - /mnt/labfiles/docker-data/jellyfin/cache:/cache
      - /mnt/labfiles/torrents:/Movies
      - /mnt/labfiles/torrents:/TV_Shows
    ports:
      - 8096:8096
      - 8920:8920 #optional
      - 7359:7359/udp #optional
      - 1900:1900/udp #optional

    restart: unless-stopped

############################
# PROWLARR
############################

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    ports:
      - 9696:9696
    environment:
      - PUID=${USER_ID}
      - PGID=${GROUP_ID}
      - TZ=America/Chicago
    volumes:
      - /mnt/labfiles/docker-data/prowlarr:/config
    restart: unless-stopped


############################
# OVERSEERR
############################

  overseerr:
    image: lscr.io/linuxserver/overseerr:latest
    container_name: overseerr
    environment:
      - PUID=${USER_ID}
      - PGID=${GROUP_ID}
      - TZ=America/Chicago
    volumes:
      - /media/arrstack/overseerr/config:/config
    ports:
      - 5055:5055
    restart: unless-stopped
